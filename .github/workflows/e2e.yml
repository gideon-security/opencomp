name: E2E

# E2E tests are intentionally NOT gated on pull_request by default:
# they boot the full app/API stack, which needs configured secrets and a
# running environment. Trigger manually (or push with the `run-e2e` label
# once secrets are configured) to exercise them.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches:
      - main

jobs:
  api-e2e:
    name: API e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: comp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comp?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/npm-install
      - name: Apply migrations
        working-directory: packages/db
        run: npx prisma migrate deploy
      - name: Run API e2e tests
        working-directory: apps/api
        run: npm run test:e2e

  app-e2e:
    name: App e2e tests (Playwright)
    runs-on: ubuntu-latest
    env:
      E2E_TEST_MODE: 'true'
      E2E_USE_REAL_AUTH: 'false'
      AUTH_SECRET: test-secret-for-e2e-only
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/npm-install
      - name: Install Playwright browsers
        working-directory: apps/app
        run: npx playwright install --with-deps chromium
      - name: Start app
        working-directory: apps/app
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          cat /tmp/app.log
          exit 1
      - name: Run app e2e tests
        working-directory: apps/app
        run: npx playwright test --project=chromium
