name: SBOM

# Publishes an SPDX SBOM artifact for audit/compliance evidence (SOC 2, ISO 27001).
#
# GitHub already natively parses pnpm-lock.yaml for its dependency graph,
# exported SBOM, and Dependabot — with fully resolved versions — so no custom
# submission step is needed here. This workflow exists purely to produce a
# standalone, downloadable SPDX SBOM artifact on a predictable schedule for
# audit trail purposes (auditors want a document, not a link to GitHub's UI).

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - '.github/workflows/sbom.yml'
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — refresh against new advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # SBOM job only parses pnpm-lock.yaml via syft — no install, no cache.
          # setup-node v5 auto-enables package-manager caching by default, which
          # tries to locate the pnpm binary and fails with
          # "Unable to locate executable file: pnpm" when pnpm isn't installed.
          package-manager-cache: false

      # Generates an SPDX SBOM from pnpm-lock.yaml and uploads it as a
      # workflow artifact. No dependency-snapshot submission: GitHub's native
      # pnpm parsing of pnpm-lock.yaml already feeds the dependency graph
      # and Dependabot accurately, so submitting a second, custom snapshot
      # here would just be a redundant duplicate.
      - name: Generate SBOM
        # Pinned to a full commit SHA (not the mutable @v0 tag): this action
        # runs in CI on every push to main, so a retag/compromise must not be
        # able to swap in altered code. Bump the SHA + comment together to upgrade.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: pnpm-lock.yaml
          format: spdx-json
          artifact-name: sbom.spdx.json
          dependency-snapshot: false
