# ============================================================================
# Redis ACL — defense-in-depth for the dev Redis (mirrors the Postgres RLS
# roles created by the `_add_rls_roles_and_tenant_policies` migration).
# ============================================================================
#
# Three logical roles, mirroring Postgres:
#
#   default      — locked behind `requirepass` (admin/maintenance only).
#   comp_app     — least-privilege application role. Restricted to keys under
#                  `app:*` (every app-owned key uses this namespace, including
#                  the per-tenant `app:{orgId}:...` keys from withTenantRedis)
#                  and to the exact command set the cache needs. No KEYS/SCAN,
#                  no FLUSH*, no CONFIG — so a tenant-scoped client can neither
#                  enumerate nor purge other tenants' keys.
#   comp_service — full data access for BullMQ queues + system/background jobs
#                  (the analog of the BYPASSRLS Postgres role), minus dangerous
#                  admin commands so a compromised queue path still cannot nuke
#                  the cache.
#
# Dev-only passwords. Rotate in real environments via the managed Redis
# (ElastiCache) — the app reads them from REDIS_URL / LOCAL_TRIGGER_REDIS_URL.
#
# Note: `-@all` (not the Redis 8-only `resetcommands`) revokes every command
# category so the per-command allowlist below is the complete grant.

requirepass comp_master_local_dev_password

user comp_app on >comp_app_local_dev_password -@all +ping +auth +echo +get +set +del +exists +expire +ttl +getdel +incr +pexpire +pexpireat +zadd +zrem +zcard +zrange +zrangebyscore +zrevrange +zremrangebyscore +eval +evalsha ~app:*

user comp_service on >comp_service_local_dev_password -@all +@all ~* -flushall -flushdb -config -shutdown -acl -slowlog -debug
